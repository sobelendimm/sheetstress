[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetstress"
version = "0.1.0"
description = "Static and LibreOffice-based checks that catch Excel template bugs before customers do"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sheetstress = "sheetstress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["lo: needs LibreOffice"]
testpaths = ["tests"]
